name: 🪐 Generate GitHub Gravity Animation

on:
  schedule:
    # Runs every 24 hours at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gravity:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out repo code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate gravity SVG using flycran/github-gravity
      # Your contribution blocks will fall and bounce over "LAMINE SAIDANE"
      - name: 🌌 Generate Gravity SVG
        uses: flycran/github-gravity@v1
        with:
          username: ${{ github.repository_owner }}
          text: 'LAMINE SAIDANE'
          output-path: deploy/gravity.svg
          font-size: 40
          shape: circle
          background-color: 'transparent'
          text-color: '#38bdf8'

      # Step 3: Publish SVG to the 'output' branch automatically
      - name: 🚀 Publish to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: output
          keep_files: true
          force_orphan: false

