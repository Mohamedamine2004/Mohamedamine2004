<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" fill="none">
  <defs>
    <!-- Background Dark Obsidian Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Ambient Cyan Glow Radial Gradient -->
    <radialGradient id="cyanGlow" cx="85%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Emerald Glow Radial Gradient -->
    <radialGradient id="emeraldGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6" />
      <circle cx="28" cy="0" r="0.75" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #38bdf8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.3px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #34d399;
      letter-spacing: 0.6px;
    }
  </style>

  <!-- Base Card Frame with Rounded Corners -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Geometric Grid Overlay -->
  <rect x="2" y="2" width="896" height="216" rx="13" fill="url(#techGrid)" />

  <!-- Ambient Radial Lighting -->
  <rect x="2" y="2" width="896" height="216" rx="13" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="896" height="216" rx="13" fill="url(#emeraldGlow)" />

  <!-- Glowing Top Accent Highlight -->
  <rect x="30" y="1" width="840" height="2" fill="url(#borderGrad)" rx="1" />

  <!-- Terminal Dot Indicators (Top Left) -->
  <g transform="translate(36, 28)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="32" cy="0" r="5" fill="#10b981" opacity="0.85" />
  </g>

  <!-- Status Pill: Seeking Stage d'État (Top Right) -->
  <g transform="translate(615, 18)">
    <rect x="0" y="0" width="248" height="28" rx="14" fill="#06281e" stroke="#10b981" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="16" cy="14" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="status-text">OPEN FOR STAGE D'ÉTAT</text>
  </g>

  <!-- Main Engineer Name -->
  <text x="36" y="96" class="name-title">Mohamed Lamine Saidane</text>

  <!-- Subtitle / Role -->
  <text x="36" y="126" class="subtitle">AI &amp; Software Engineering Student @ ESPRIT · Full-Stack &amp; Systems Architect</text>

  <!-- Pill Badges Row -->
  <!-- Badge 1: ESPRIT Track -->
  <g transform="translate(36, 156)">
    <rect x="0" y="0" width="168" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="badge-text" fill="#93c5fd">🎓 ESPRIT · AI Track</text>
  </g>

  <!-- Badge 2: Mention Très Bien -->
  <g transform="translate(214, 156)">
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="badge-text" fill="#fbbf24">🏅 Mention Très Bien (GLSI)</text>
  </g>

  <!-- Badge 3: Polyglot Stack -->
  <g transform="translate(414, 156)">
    <rect x="0" y="0" width="230" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="badge-text" fill="#67e8f9">⚡ Spring Boot · NestJS · ML</text>
  </g>

  <!-- Badge 4: Location -->
  <g transform="translate(654, 156)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="badge-text" fill="#94a3b8">📍 Tunis, Tunisia</text>
  </g>

  <!-- Bottom Cyber Glow Line -->
  <rect x="36" y="206" width="828" height="1" fill="url(#borderGrad)" opacity="0.4" />
</svg>
